[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-serving"
version = "0.1.0"
description = "Real-time fraud-scoring Flask API: Redis online-store feature fetch + XGBoost inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=21.2",
    "redis>=5.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "fakeredis>=2.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
