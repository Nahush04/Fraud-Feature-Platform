[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-train"
version = "0.1.0"
description = "XGBoost + MLflow fraud model training, walk-forward golden eval set, logistic-regression baseline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "mlflow>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fraud-train = "train.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
