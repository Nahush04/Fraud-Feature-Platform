[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-ingest"
version = "0.1.0"
description = "Config-driven CLI to load IEEE-CIS CSVs into Snowflake raw tables."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "snowflake-connector-python[pandas]>=3.6",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fraud-ingest = "ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
