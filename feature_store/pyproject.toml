[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-fstore"
version = "0.1.0"
description = "Feature store: offline (Delta/parquet) reads, online (Redis) materialization, point-in-time joins for training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "redis>=5.0",
    "deltalake>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "fakeredis>=2.20"]

[project.scripts]
fstore = "fstore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
